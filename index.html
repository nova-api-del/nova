<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{--bg:#0f1115;--card:#181b22;--tx:#e8eaf0;--mut:#8b91a0;--ac:#6c8cff;--ok:#3ecf8e;--er:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:16px;max-width:480px;margin-inline:auto}
  h1{text-align:center;color:var(--ac);letter-spacing:2px}
  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px}
  h3{margin:0 0 10px}
  input{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid #2a2f3a;background:#0f1115;color:var(--tx);font-size:16px}
  button{width:100%;padding:12px;margin-top:8px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:16px;font-weight:600}
  button.sec{background:#2a2f3a}
  .bal{font-size:36px;font-weight:700;color:var(--ok);text-align:center}
  .msg{padding:10px;border-radius:10px;margin-bottom:12px;display:none;font-size:14px}
  .msg.ok{background:#12301f;color:var(--ok);display:block}
  .msg.er{background:#3a1717;color:var(--er);display:block}
  .tx{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2a2f3a;font-size:14px}
  .in{color:var(--ok)}.out{color:var(--er)}
  .hide{display:none}
  small{color:var(--mut)}
</style>
</head>
<body>
<h1>NOVA</h1>
<div id="msg" class="msg"></div>

<div id="auth" class="card">
  <h3>تسجيل الدخول</h3>
  <input id="em" type="email" placeholder="الإيميل" autocomplete="email">
  <input id="pw" type="password" placeholder="الباسورد" autocomplete="current-password">
  <button onclick="login()">دخول</button>
  <button class="sec" onclick="signup()">إنشاء حساب جديد</button>
</div>

<div id="app" class="hide">
  <div class="card">
    <small id="who"></small>
    <div class="bal"><span id="bal">0</span> NOVA</div>
    <small>رصيد تجريبي داخل التطبيق، بدون قيمة نقدية.</small>
  </div>

  <div class="card">
    <h3>تحويل</h3>
    <input id="to" type="email" placeholder="إيميل المستلم">
    <input id="am" type="number" inputmode="decimal" placeholder="المبلغ">
    <input id="nt" placeholder="ملاحظة (اختياري)">
    <button onclick="transfer()">إرسال</button>
  </div>

  <div id="adm" class="card hide">
    <h3>لوحة الأدمن: إضافة رصيد</h3>
    <input id="ge" type="email" placeholder="إيميل المستخدم">
    <input id="ga" type="number" inputmode="decimal" placeholder="المبلغ">
    <button onclick="grant()">إضافة</button>
  </div>

  <div class="card">
    <h3>آخر المعاملات</h3>
    <div id="txs"></div>
  </div>
  <button class="sec" onclick="logout()">خروج</button>
</div>

<script>
const SB_URL="https://rkxdzkwmavpdbaupnsxz.supabase.co";
const SB_KEY="sb_publishable_RldGRZYvOIVK-1SrEZE7Sw_tW3eUav8";
const FN=SB_URL+"/functions/v1/nova-api";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
let me=null;

function show(t,c){const m=$("msg");m.textContent=t;m.className="msg "+c;setTimeout(()=>m.className="msg",5000)}

async function api(body){
  const {data:{session}}=await sb.auth.getSession();
  const r=await fetch(FN,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token,"apikey":SB_KEY},body:JSON.stringify(body)});
  const j=await r.json();
  if(!r.ok) throw new Error(j.error||"خطأ");
  return j;
}

async function login(){
  const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(error) return show(error.message,"er");
  init();
}
async function signup(){
  const {error}=await sb.auth.signUp({email:$("em").value.trim(),password:$("pw").value});
  if(error) return show(error.message,"er");
  show("تم إنشاء الحساب. إذا ما دخلت تلقائياً اضغط دخول.","ok");
  init();
}
async function logout(){await sb.auth.signOut();location.reload()}

async function load(){
  const {data:w}=await sb.from("wallets").select("balance").eq("user_id",me.id).maybeSingle();
  $("bal").textContent=w?Number(w.balance).toLocaleString("en"):"0";
  const {data:t}=await sb.from("transactions").select("*").order("created_at",{ascending:false}).limit(15);
  $("txs").innerHTML=(t||[]).map(x=>{
    const inc=x.to_user===me.id;
    return `<div class="tx"><span>${x.note?x.note.replace(/</g,"&lt;"):(x.from_user?(inc?"استلام":"إرسال"):"رصيد من الإدارة")}</span><b class="${inc?"in":"out"}">${inc?"+":"-"}${Number(x.amount)}</b></div>`
  }).join("")||"<small>لا توجد معاملات</small>";
  const {data:a}=await sb.from("admins").select("user_id").eq("user_id",me.id).maybeSingle();
  $("adm").classList.toggle("hide",!a);
}

async function transfer(){
  try{
    await api({action:"transfer",to_email:$("to").value.trim(),amount:$("am").value,note:$("nt").value});
    show("تم التحويل","ok");$("to").value=$("am").value=$("nt").value="";load();
  }catch(e){show(e.message,"er")}
}
async function grant(){
  try{
    const r=await api({action:"grant",email:$("ge").value.trim(),amount:$("ga").value});
    show("تمت الإضافة. الرصيد الجديد: "+r.new_balance,"ok");$("ge").value=$("ga").value="";load();
  }catch(e){show(e.message,"er")}
}

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return;
  me=session.user;
  $("auth").classList.add("hide");$("app").classList.remove("hide");
  $("who").textContent=me.email;
  load();
}
init();
</script>
</body>
</html>
