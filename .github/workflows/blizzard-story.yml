name: Render 10-minute Blizzard Mystery
on:
  push:
    paths:
      - 'scripts/blizzard_story.py'
      - '.github/workflows/blizzard-story.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts
      - name: Render illustrated story
        run: python scripts/blizzard_story.py
      - name: Verify final MP4
        run: |
          test -s output/blizzard_episode/blizzard_story_10min.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 output/blizzard_episode/blizzard_story_10min.mp4
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/blizzard_episode')
          m=json.loads((p/'metadata.json').read_text())
          assert m['duration_seconds'] >= 598, m
          assert m['scenes'] == 24, m
          assert (p/'blizzard_story_10min.mp4').stat().st_size > 5000000
          print('PASS',m)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: blizzard-story-\${{ github.run_number }}
          path: output/blizzard_episode/*
          retention-days: 14
      - name: Publish downloadable release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blizzard-story-\${{ github.run_number }}
          name: Blizzard Mystery Story \${{ github.run_number }}
          files: |
            output/blizzard_episode/blizzard_story_10min.mp4
            output/blizzard_episode/assets/thumbnail.png
            output/blizzard_episode/metadata.json
          generate_release_notes: false
