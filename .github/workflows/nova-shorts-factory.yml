name: Nova Shorts Factory
on:
  workflow_dispatch:
    inputs:
      count:
        description: "Cinematic Shorts to build (start with 1 for quality review)"
        required: false
        default: "1"
concurrency:
  group: nova-shorts-factory
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      COUNT: ${{ github.event.inputs.count || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements-shorts.txt
      - name: Build real-footage cinematic Shorts
        run: |
          rm -rf output
          mkdir -p output
          for i in $(seq 0 $((COUNT-1))); do
            python scripts/cinematic_shorts.py --slot "$i"
          done
      - name: Enforce footage quality gate
        run: |
          python - <<'PY'
          import glob, json
          files=glob.glob('output/short_*.json')
          assert files, 'No video metadata generated'
          for path in files:
              item=json.load(open(path))
              assert item.get('quality_gate') == 'passed', path
              assert item.get('visual_type') == 'five_distinct_moving_video_clips', path
              assert len({source['url'] for source in item['sources']}) == 5, path
          print(f'PASS: {len(files)} cinematic video(s), each with five distinct moving-footage sources')
          PY
      - name: Upload Shorts
        uses: actions/upload-artifact@v4
        with:
          name: nova-cinematic-shorts-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 7
      - name: Upload metadata and footage credits
        uses: actions/upload-artifact@v4
        with:
          name: nova-cinematic-metadata-${{ github.run_number }}
          path: output/*.json
          retention-days: 7
      - name: Publish downloadable video release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nova-cinematic-${{ github.run_number }}
          name: Nova Cinematic Shorts ${{ github.run_number }}
          files: output/*.mp4
          generate_release_notes: false
