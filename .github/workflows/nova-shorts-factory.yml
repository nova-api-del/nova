name: Nova Shorts Factory
on:
  push:
    paths:
      - 'scripts/cinematic_shorts.py'
      - 'scripts/strict_visual_gate.py'
      - '.github/workflows/nova-shorts-factory.yml'
  workflow_dispatch:
    inputs:
      count:
        description: "Cinematic Shorts to build (start with 1 for quality review)"
        required: false
        default: "1"
      ai_mode:
        description: "AI mode: auto uses AI only when a compatible GPU/model is available"
        required: false
        default: "auto"
concurrency:
  group: nova-shorts-factory
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      COUNT: ${{ github.event.inputs.count || '1' }}
      AI_MODE: ${{ github.event.inputs.ai_mode || 'auto' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and caption fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Verify FFmpeg and install Python dependencies
        run: |
          ffmpeg -version | head -n 1
          ffmpeg -filters 2>/dev/null | grep -E ' subtitles | freezedetect | blackdetect '
          fc-match "DejaVu Sans" | head -n 1
          python -m pip install --disable-pip-version-check --upgrade pip
          pip install --disable-pip-version-check -r requirements-shorts.txt
      - name: Build multi-source cinematic Shorts
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_IMAGE_MODEL: ${{ vars.POLLINATIONS_IMAGE_MODEL }}
          AI_MODE: ${{ env.AI_MODE }}
        run: |
          rm -rf output
          mkdir -p output
          for i in $(seq 0 $((COUNT-1))); do
            python scripts/cinematic_shorts.py --slot "$i"
          done
      - name: Verify synchronized karaoke captions
        run: |
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path('output').glob('voice_*.ass'))
          assert files, 'No generated subtitle files found'
          for path in files:
              data = path.read_text(encoding='utf-8')
              assert r'\kf' in data, f'No word-synchronized karaoke timings in {path}'
              assert r'\pos(540,1400)' in data, f'Captions are not centered in lower-middle safe area: {path}'
          print(f'PASS: {len(files)} synchronized TikTok-style caption track(s)')
          PY
      - name: Run strict visual quality gate
        run: python scripts/strict_visual_gate.py
      - name: Enforce footage quality gate
        run: |
          python - <<'PY'
          import glob, json
          files=glob.glob('output/short_*.json')
          assert files, 'No video metadata generated'
          for path in files:
              item=json.load(open(path))
              assert item.get('quality_gate') == 'passed', path
              assert item.get('visual_quality_gate') == 'passed', path
              assert item.get('visual_type') == 'five_distinct_animated_scenes', path
              assert 45 <= item.get('duration_seconds', 0) <= 64, path
              assert len(item['sources']) == 5, path
              assert sum(source.get('kind') != 'ai_generated_image_animated' for source in item['sources']) >= 3, path
              assert sum(source.get('kind') not in ('ai_generated_image_animated', 'licensed_image_animated') for source in item['sources']) >= 3, path
              assert sum(source.get('kind') == 'ai_generated_image_animated' for source in item['sources']) <= 2, path
          print(f'PASS: {len(files)} cinematic video(s)')
          PY
      - name: Upload Shorts
        uses: actions/upload-artifact@v4
        with:
          name: nova-cinematic-shorts-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 7
      - name: Upload metadata and footage credits
        uses: actions/upload-artifact@v4
        with:
          name: nova-cinematic-metadata-${{ github.run_number }}
          path: output/*.json
          retention-days: 7
      - name: Publish downloadable video release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nova-cinematic-${{ github.run_number }}
          name: Nova Cinematic Shorts ${{ github.run_number }}
          files: output/*.mp4
          generate_release_notes: false
