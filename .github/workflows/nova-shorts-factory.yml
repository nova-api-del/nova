name: Nova Shorts Factory
on:
  workflow_dispatch:
    inputs:
      count:
        description: "Shorts to build"
        required: false
        default: "6"
  schedule:
    - cron: "0 16 * * *"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      COUNT: ${{ github.event.inputs.count || '6' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements-shorts.txt
      - name: Build Shorts
        run: |
          rm -rf output
          mkdir -p output
          for i in $(seq 0 $((COUNT-1))); do
            python scripts/shorts_factory.py --slot "$i"
          done
      - name: Upload Shorts
        uses: actions/upload-artifact@v4
        with:
          name: nova-shorts-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 7
      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: nova-metadata-${{ github.run_number }}
          path: output/*.json
          retention-days: 7
      - name: Publish downloadable video release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nova-shorts-${{ github.run_number }}
          name: Nova Shorts ${{ github.run_number }}
          files: output/*.mp4
          generate_release_notes: false
