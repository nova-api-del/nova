name: Nova Illustrated Story Episode
on:
  push:
    paths:
      - 'scripts/story_episode.py'
      - '.github/workflows/nova-story-episode.yml'
  workflow_dispatch:
    inputs:
      episode:
        description: "Story episode preset"
        required: false
        default: "blizzard-three-nights"
jobs:
  build-story:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts requests Pillow
      - name: Generate narrated illustrated story
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_IMAGE_MODEL: ${{ vars.POLLINATIONS_IMAGE_MODEL }}
          TTS_VOICE: en-US-GuyNeural
        run: |
          rm -rf output/story_episode
          python scripts/story_episode.py
      - name: Verify final story
        run: |
          test -s output/story_episode/nova_story_episode.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 output/story_episode/nova_story_episode.mp4
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('output/story_episode/metadata.json').read_text())
          assert 450 <= m['duration_seconds'] <= 700, m
          assert m['scenes'] == 18, m
          assert Path('output/story_episode/nova_story_episode.mp4').stat().st_size > 2_000_000
          print('PASS: narrated story episode, 18 scenes, subtitles and audio')
          PY
      - name: Upload episode and credits
        uses: actions/upload-artifact@v4
        with:
          name: nova-story-episode-${{ github.run_number }}
          path: output/story_episode/*
          retention-days: 14
      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nova-story-${{ github.run_number }}
          name: Nova Illustrated Story ${{ github.run_number }}
          files: |
            output/story_episode/nova_story_episode.mp4
            output/story_episode/metadata.json
          generate_release_notes: false
