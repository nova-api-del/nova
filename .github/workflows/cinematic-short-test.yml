name: Nova Cinematic Short Test
on:
  push:
    branches: [main]
    paths:
      - 'scripts/cinematic_shorts.py'
      - 'scripts/strict_visual_gate.py'
      - '.github/workflows/cinematic-short-test.yml'
  workflow_dispatch:
    inputs:
      slot:
        description: "Topic slot to test (0-5)"
        required: true
        default: "0"
concurrency:
  group: nova-cinematic-short-test
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  cinematic-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up cached static FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
          linking-type: static
          github-token: ${{ github.token }}
      - name: Verify FFmpeg filters and fonts
        run: |
          set -euo pipefail
          ffmpeg -version | head -n 1
          command -v ffprobe
          ffmpeg -filters 2>/dev/null | grep -E ' subtitles | freezedetect | blackdetect '
          fc-match "DejaVu Sans" | head -n 1
      - name: Install Python dependencies
        timeout-minutes: 8
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          pip install --disable-pip-version-check -r requirements-shorts.txt
      - name: Generate cinematic Short
        timeout-minutes: 15
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_IMAGE_MODEL: ${{ vars.POLLINATIONS_IMAGE_MODEL }}
        run: python scripts/cinematic_shorts.py --slot "${{ inputs.slot || '0' }}"
      - name: Strict visual quality gate
        timeout-minutes: 5
        run: python scripts/strict_visual_gate.py
      - name: Validate deliverable metadata
        run: |
          python - <<'PY'
          import json, glob
          p=glob.glob("output/short_*.json")[0]
          m=json.load(open(p))
          assert m["quality_gate"] == "passed"
          assert m["visual_quality_gate"] == "passed"
          assert m["visual_type"] == "five_distinct_moving_scenes"
          assert len(m["sources"]) == 5
          assert sum(x.get("kind") != "ai_generated_image_animated" for x in m["sources"]) >= 3
          print("PASS:", m["title"], m["duration_seconds"], "seconds; strict visual gate passed")
          PY
      - name: Upload generated video and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-cinematic-test-${{ github.run_number }}
          path: output/short_*
          if-no-files-found: warn
          retention-days: 7
