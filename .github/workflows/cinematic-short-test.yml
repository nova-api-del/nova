name: Nova Cinematic Short Test
on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Topic slot to test (0-5)"
        required: true
        default: "0"
permissions:
  contents: read
jobs:
  cinematic-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-shorts.txt
      - name: Generate cinematic Short (fails closed if footage is missing)
        run: python scripts/cinematic_shorts.py --slot "${{ inputs.slot }}"
      - name: Validate deliverable metadata
        run: |
          python - <<'PY'
          import json, glob
          p=glob.glob("output/short_*.json")[0]
          m=json.load(open(p))
          assert m["quality_gate"] == "passed"
          assert m["visual_type"] == "five_distinct_moving_video_clips"
          assert len({x["url"] for x in m["sources"]}) == 5
          print("PASS:", m["title"], m["duration_seconds"], "seconds; five unique video sources")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nova-cinematic-test-${{ github.run_number }}
          path: output/short_*
          retention-days: 7
