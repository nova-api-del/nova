name: Nova Daily Short
on:
  workflow_dispatch:
  schedule:
    # 19:00 Baghdad time (UTC+3)
    - cron: "0 16 * * *"
permissions:
  contents: read
jobs:
  build-short:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python packages
        run: python -m pip install --upgrade pip edge-tts pillow
      - name: Generate English Short
        run: python scripts/generate_short.py
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-short-${{ github.run_number }}
          path: output/
          retention-days: 7
