name: Nova AI GPU Worker

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "English scene prompt"
        required: true
        type: string

jobs:
  ai:
    # Requires a self-hosted runner with NVIDIA CUDA.
    # GitHub-hosted free runners do not provide the GPU required by Wan2.1.
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA/Python dependencies
        run: |
          python -m pip install --upgrade pip
          git clone --depth 1 https://github.com/Wan-Video/Wan2.1.git
          pip install -r Wan2.1/requirements.txt

      - name: Download Wan2.1 1.3B if missing
        run: |
          mkdir -p models
          if [ ! -d models/Wan2.1-T2V-1.3B ]; then
            pip install -U "huggingface_hub[cli]"
            huggingface-cli download Wan-AI/Wan2.1-T2V-1.3B               --local-dir models/Wan2.1-T2V-1.3B
          fi

      - name: Generate AI scene
        env:
          PROMPT: ${{ inputs.prompt }}
        run: |
          mkdir -p output
          python scripts/wan2x_ai.py --prompt "$PROMPT" --out output/ai_scene.mp4

      - name: Upload AI scene
        uses: actions/upload-artifact@v4
        with:
          name: nova-ai-scene
          path: output/ai_scene.mp4
